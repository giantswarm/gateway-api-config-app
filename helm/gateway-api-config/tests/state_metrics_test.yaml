suite: kube-state-metrics for Gateway API resources
templates:
  - templates/state-metrics/configmap.yaml
  - templates/state-metrics/deployment.yaml
  - templates/state-metrics/podmonitor.yaml
  - templates/state-metrics/rbac.yaml
release:
  name: gateway-api-config
  namespace: envoy-gateway-system
tests:
  - it: exports the HTTPRoute rule backends
    template: templates/state-metrics/configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "metricNamePrefix: gatewayapi_httproute"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "name: rule_backend_info"
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'backend2_name:\s+- backendRefs\s+- "2"\s+- name'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'match_path_type:\s+- matches\s+- "0"\s+- path\s+- type'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'rule_name:\s+- name'

  - it: runs kube-state-metrics for custom resources only, with the rendered config
    template: templates/state-metrics/deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: gateway-api-config-state-metrics
      - contains:
          path: spec.template.spec.containers[0].args
          content: --custom-resource-state-only=true
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: gateway-api-config-state-metrics
      - equal:
          path: spec.template.spec.containers[0].image
          value: gsoci.azurecr.io/giantswarm/kube-state-metrics:v2.15.0
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]
      - contains:
          path: spec.template.spec.containers[0].args
          content: --auto-gomemlimit
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /livez
            port: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /readyz
            port: telemetry
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: telemetry
              containerPort: 8081
              protocol: TCP

  # The checksum is the hash of the resources rendered from files/state-metrics. Update it when
  # they change. Comment-only edits of the files do not change it.
  - it: does not restart kube-state-metrics on a chart release that leaves it unchanged
    template: templates/state-metrics/deployment.yaml
    chart:
      version: 9.9.9
    asserts:
      - notExists:
          path: spec.template.metadata.labels["helm.sh/chart"]
      - equal:
          path: spec.template.metadata.annotations["checksum/config"]
          value: 49078c369622aedc3e3a6a72b24f170d6cb9910b61c0733704b8d8afd35a20ef

  - it: scrapes the pod with the team label and keeps the exported namespace
    template: templates/state-metrics/podmonitor.yaml
    asserts:
      - equal:
          path: metadata.labels["application.giantswarm.io/team"]
          value: cabbage
      - equal:
          path: spec.podMetricsEndpoints[0].honorLabels
          value: true
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: gateway-api-config-state-metrics
            app.kubernetes.io/component: state-metrics

  - it: only reads the API groups of the configured resources
    template: templates/state-metrics/rbac.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: rules[0].apiGroups
          value: [gateway.networking.k8s.io]
      - equal:
          path: rules[0].resources
          value: [httproutes]
      - equal:
          path: rules[0].verbs
          value: [list, watch]
      - equal:
          path: rules[1].apiGroups
          value: [apiextensions.k8s.io]

  - it: renders nothing when disabled
    set:
      stateMetrics:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

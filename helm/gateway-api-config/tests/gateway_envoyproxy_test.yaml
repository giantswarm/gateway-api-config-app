suite: gateway EnvoyProxy provider defaults
templates:
  - templates/gateway/envoyproxy.yaml
release:
  name: gateway-api-config
  namespace: envoy-gateway-system
tests:
  - it: renders one EnvoyProxy for the default gateway
    set:
      provider: capa
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: EnvoyProxy
      - equal:
          path: metadata.name
          value: gateway-giantswarm-default
      - equal:
          path: spec.mergeType
          value: StrategicMerge

  - it: prefers one proxy pod per node on CAPA with an NLB
    set:
      provider: capa
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.pod.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution
          value:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: gateway.envoyproxy.io/owning-gateway-name
                      operator: In
                      values:
                        - giantswarm-default
                    - key: gateway.envoyproxy.io/owning-gateway-namespace
                      operator: In
                      values:
                        - envoy-gateway-system
      - exists:
          path: spec.provider.kubernetes.envoyDeployment.pod.topologySpreadConstraints

  - it: keeps terminationGracePeriodSeconds above the drain timeout on CAPA with an NLB
    set:
      provider: capa
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.patch
          value:
            type: StrategicMerge
            value:
              spec:
                template:
                  spec:
                    terminationGracePeriodSeconds: 240
      - equal:
          path: spec.shutdown
          value:
            healthCheckFailureDelay: 30s
            drainTimeout: 200s
            minDrainDuration: 180s

  - it: sets the NLB service defaults on CAPA
    set:
      provider: capa
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyService.loadBalancerClass
          value: service.k8s.aws/nlb
      - equal:
          path: spec.provider.kubernetes.envoyService.externalTrafficPolicy
          value: Local
      - equal:
          path: spec.provider.kubernetes.envoyService.annotations["service.beta.kubernetes.io/aws-load-balancer-scheme"]
          value: internet-facing
      - equal:
          path: spec.provider.kubernetes.envoyService.annotations["service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags"]
          value: gateway.envoyproxy.io/owning-gateway-name=giantswarm-default,gateway.envoyproxy.io/owning-gateway-namespace=envoy-gateway-system
      - notExists:
          path: spec.provider.kubernetes.envoyService.annotations["service.beta.kubernetes.io/aws-load-balancer-subnets"]

  - it: lets gateway service annotations override the NLB defaults
    set:
      provider: capa
      gateways.default.service.annotations:
        service.beta.kubernetes.io/aws-load-balancer-scheme: internal
        service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-a,subnet-b
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyService.annotations["service.beta.kubernetes.io/aws-load-balancer-scheme"]
          value: internal
      - equal:
          path: spec.provider.kubernetes.envoyService.annotations["service.beta.kubernetes.io/aws-load-balancer-subnets"]
          value: subnet-a,subnet-b

  - it: appends additional resource tags to the owning-gateway tags
    set:
      provider: capa
      gateways.default.provider.aws.additionalResourceTags:
        team: platform
        datadog: monitored
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyService.annotations["service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags"]
          value: gateway.envoyproxy.io/owning-gateway-name=giantswarm-default,gateway.envoyproxy.io/owning-gateway-namespace=envoy-gateway-system,datadog=monitored,team=platform

  - it: lets a gateway tags annotation replace the additional resource tags
    set:
      provider: capa
      gateways.default.provider.aws.additionalResourceTags:
        datadog: monitored
      gateways.default.envoyProxy.envoyService.annotations:
        service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: owner=me
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyService.annotations["service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags"]
          value: owner=me

  - it: adds no NLB defaults on CAPA when the NLB is disabled
    set:
      provider: capa
      gateways.default.provider.aws.useNetworkLoadBalancer: false
    asserts:
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment
      - notExists:
          path: spec.shutdown
      - notExists:
          path: spec.provider.kubernetes.envoyService.loadBalancerClass
      - equal:
          path: spec.provider.kubernetes.envoyService.externalTrafficPolicy
          value: Cluster

  - it: adds no AWS defaults on other providers
    set:
      provider: capz
    asserts:
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment.pod
      - notExists:
          path: spec.provider.kubernetes.envoyService.annotations["service.beta.kubernetes.io/aws-load-balancer-scheme"]
      - equal:
          path: spec.provider.kubernetes.envoyService.annotations["external-dns.alpha.kubernetes.io/hostname"]
          value: gateway.example.com

  - it: sets the graceful shutdown timers on Azure
    set:
      provider: capz
    asserts:
      - equal:
          path: spec.shutdown
          value:
            healthCheckFailureDelay: 30s
            drainTimeout: 90s
            minDrainDuration: 60s
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.patch
          value:
            type: StrategicMerge
            value:
              spec:
                template:
                  spec:
                    terminationGracePeriodSeconds: 120
      - equal:
          path: spec.provider.kubernetes.envoyService.externalTrafficPolicy
          value: Cluster

  - it: adds no shutdown defaults on other providers
    set:
      provider: vsphere
    asserts:
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment
      - notExists:
          path: spec.shutdown

  - it: adds no shutdown defaults without a provider
    set:
      provider: ""
    asserts:
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment
      - notExists:
          path: spec.shutdown

  - it: lets a GatewayClass shutdown field win over the Azure defaults
    set:
      provider: capz
      gatewayClasses.default.envoyProxy.shutdown:
        drainTimeout: 300s
    asserts:
      - equal:
          path: spec.shutdown
          value:
            healthCheckFailureDelay: 30s
            minDrainDuration: 60s
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment.patch

  - it: keeps the Azure defaults when the gateway replaces the GatewayClass EnvoyProxy
    set:
      provider: capz
      gatewayClasses.default.envoyProxy.shutdown:
        drainTimeout: 300s
      gateways.default.envoyProxy.mergeType: Replace
    asserts:
      - equal:
          path: spec.shutdown.drainTimeout
          value: 90s
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.patch.value.spec.template.spec.terminationGracePeriodSeconds
          value: 120

  - it: leaves out the grace period patch when the gateway sets its own drain timeout
    set:
      provider: capz
      gateways.default.envoyProxy.shutdown.drainTimeout: 300s
    asserts:
      - equal:
          path: spec.shutdown.drainTimeout
          value: 300s
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment.patch

  - it: leaves out the grace period patch when the GatewayClass EnvoyProxy sets a patch
    set:
      provider: capz
      gatewayClasses.default.envoyProxy.envoyDeployment.patch:
        type: StrategicMerge
        value:
          spec:
            template:
              spec:
                terminationGracePeriodSeconds: 600
    asserts:
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment.patch
      - equal:
          path: spec.shutdown.drainTimeout
          value: 90s

  - it: keeps the grace period patch when the gateway replaces a GatewayClass patch
    set:
      provider: capz
      gatewayClasses.default.envoyProxy.envoyDeployment.patch:
        type: StrategicMerge
        value:
          spec:
            template:
              spec:
                terminationGracePeriodSeconds: 600
      gateways.default.envoyProxy.mergeType: Replace
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.patch.value.spec.template.spec.terminationGracePeriodSeconds
          value: 120

  - it: leaves out the grace period on CAPA when the GatewayClass sets a drain timeout
    set:
      provider: capa
      gatewayClasses.default.envoyProxy.shutdown:
        drainTimeout: 300s
    asserts:
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment.patch
      - equal:
          path: spec.shutdown
          value:
            healthCheckFailureDelay: 30s
            minDrainDuration: 180s
      - exists:
          path: spec.provider.kubernetes.envoyDeployment.pod.affinity
      - exists:
          path: spec.provider.kubernetes.envoyDeployment.pod.topologySpreadConstraints

  - it: leaves the GatewayClass patch alone with JSONMerge
    set:
      provider: capz
      gatewayClasses.default.envoyProxy.envoyDeployment.patch:
        type: StrategicMerge
        value:
          spec:
            template:
              spec:
                terminationGracePeriodSeconds: 600
      gateways.default.envoyProxy.mergeType: JSONMerge
    asserts:
      - equal:
          path: spec.mergeType
          value: JSONMerge
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment.patch

  - it: merges a gateway patch with the grace period patch on CAPA
    set:
      provider: capa
      gateways.default.envoyProxy.envoyDeployment.patch:
        type: JSONMerge
        value:
          spec:
            replicas: 3
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.patch
          value:
            type: JSONMerge
            value:
              spec:
                replicas: 3
                template:
                  spec:
                    terminationGracePeriodSeconds: 240
      - exists:
          path: spec.provider.kubernetes.envoyDeployment.pod.affinity

  - it: leaves out the grace period patch when the GatewayClass sets a health check failure delay
    set:
      provider: capz
      gatewayClasses.default.envoyProxy.shutdown:
        healthCheckFailureDelay: 60s
    asserts:
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment.patch
      - notExists:
          path: spec.shutdown.healthCheckFailureDelay

  - it: keeps the other CAPA timers when the gateway overrides some of them
    set:
      provider: capa
      gateways.default.envoyProxy.shutdown:
        minDrainDuration: 300s
        drainTimeout: 330s
    asserts:
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment.patch
      - equal:
          path: spec.shutdown
          value:
            healthCheckFailureDelay: 30s
            minDrainDuration: 300s
            drainTimeout: 330s
      - exists:
          path: spec.provider.kubernetes.envoyDeployment.pod.affinity

  - it: leaves out the grace period when a gateway patch comes with a shutdown override
    set:
      provider: capz
      gateways.default.envoyProxy.shutdown.drainTimeout: 600s
      gateways.default.envoyProxy.envoyDeployment.patch:
        type: JSONMerge
        value:
          spec:
            replicas: 3
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.patch
          value:
            type: JSONMerge
            value:
              spec:
                replicas: 3

  - it: merges a gateway patch with the Azure grace period
    set:
      provider: capz
      gateways.default.envoyProxy.envoyDeployment.patch:
        type: StrategicMerge
        value:
          spec:
            replicas: 3
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.patch
          value:
            type: StrategicMerge
            value:
              spec:
                replicas: 3
                template:
                  spec:
                    terminationGracePeriodSeconds: 120

  - it: adds no grace period to a gateway patch on CAPA without an NLB
    set:
      provider: capa
      gateways.default.provider.aws.useNetworkLoadBalancer: false
      gateways.default.envoyProxy.envoyDeployment.patch:
        type: JSONMerge
        value:
          spec:
            replicas: 3
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.patch
          value:
            type: JSONMerge
            value:
              spec:
                replicas: 3
      - notExists:
          path: spec.shutdown

  - it: keeps the CAPA timer set when the gateway replaces a GatewayClass shutdown
    set:
      provider: capa
      gatewayClasses.default.envoyProxy.shutdown:
        drainTimeout: 300s
      gateways.default.envoyProxy.mergeType: Replace
    asserts:
      - equal:
          path: spec.shutdown.drainTimeout
          value: 200s
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.patch.value.spec.template.spec.terminationGracePeriodSeconds
          value: 240

  - it: leaves out the GatewayClass shutdown fields with JSONMerge
    set:
      provider: capz
      gatewayClasses.default.envoyProxy.shutdown:
        minDrainDuration: 45s
      gateways.default.envoyProxy.mergeType: JSONMerge
    asserts:
      - equal:
          path: spec.shutdown
          value:
            healthCheckFailureDelay: 30s
            drainTimeout: 90s
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment.patch

  - it: keeps the CAPA timers and pod defaults when the GatewayClass sets a patch
    set:
      provider: capa
      gatewayClasses.default.envoyProxy.envoyDeployment.patch:
        type: StrategicMerge
        value:
          spec:
            template:
              spec:
                terminationGracePeriodSeconds: 600
    asserts:
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment.patch
      - equal:
          path: spec.shutdown.minDrainDuration
          value: 180s
      - exists:
          path: spec.provider.kubernetes.envoyDeployment.pod.affinity

  - it: passes a gateway shutdown through on other providers without a grace period
    set:
      provider: vsphere
      gateways.default.envoyProxy.shutdown:
        drainTimeout: 120s
    asserts:
      - equal:
          path: spec.shutdown
          value:
            drainTimeout: 120s
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment

  - it: leaves out the anti-affinity default when the GatewayClass EnvoyProxy sets affinity
    set:
      provider: capa
      gatewayClasses.default.envoyProxy.envoyDeployment.pod.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - eu-central-1a
    asserts:
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment.pod.affinity
      - exists:
          path: spec.provider.kubernetes.envoyDeployment.patch

  - it: merges gateway affinity values over the anti-affinity default
    set:
      provider: capa
      gateways.default.envoyProxy.envoyDeployment.pod.affinity.nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values:
                    - eu-central-1a
    asserts:
      - exists:
          path: spec.provider.kubernetes.envoyDeployment.pod.affinity.podAntiAffinity
      - exists:
          path: spec.provider.kubernetes.envoyDeployment.pod.affinity.nodeAffinity

  - it: renders nothing when the gateway is disabled
    set:
      provider: capa
      gateways.default.enabled: false
    asserts:
      - hasDocuments:
          count: 0

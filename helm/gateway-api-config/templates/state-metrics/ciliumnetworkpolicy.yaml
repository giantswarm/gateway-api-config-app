{{- if and .Values.stateMetrics.enabled (.Capabilities.APIVersions.Has "cilium.io/v2/CiliumNetworkPolicy") }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "stateMetrics.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stateMetrics.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "stateMetrics.selector" . | nindent 6 }}
  egress:
    - toEntities:
        - kube-apiserver
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
{{- end }}

{{- if .Values.stateMetrics.enabled }}
{{- $groups := dict }}
{{- range (include "stateMetrics.resources" . | fromYamlArray) }}
{{- $group := .groupVersionKind.group }}
{{- $_ := set $groups $group (append (get $groups $group | default list) .resourcePlural | uniq | sortAlpha) }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stateMetrics.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stateMetrics.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stateMetrics.name" . }}
  labels:
    {{- include "stateMetrics.labels" . | nindent 4 }}
rules:
  {{- range $group := keys $groups | sortAlpha }}
  - apiGroups:
      - {{ $group | quote }}
    resources:
      {{- range get $groups $group }}
      - {{ . | quote }}
      {{- end }}
    verbs:
      - list
      - watch
  {{- end }}
  # kube-state-metrics discovers the custom resources through their CRDs.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "stateMetrics.name" . }}
  labels:
    {{- include "stateMetrics.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "stateMetrics.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "stateMetrics.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

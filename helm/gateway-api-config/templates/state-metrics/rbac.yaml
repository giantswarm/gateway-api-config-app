{{- if .Values.stateMetrics.enabled }}
{{- $groups := list }}
{{- range (include "stateMetrics.resources" . | fromYamlArray) }}
{{- $groups = append $groups .groupVersionKind.group }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stateMetrics.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stateMetrics.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stateMetrics.name" . }}
  labels:
    {{- include "stateMetrics.labels" . | nindent 4 }}
rules:
  {{- range $groups | uniq | sortAlpha }}
  - apiGroups:
      - {{ . | quote }}
    resources:
      - "*"
    verbs:
      - list
      - watch
  {{- end }}
  # kube-state-metrics discovers the custom resources through their CRDs.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "stateMetrics.name" . }}
  labels:
    {{- include "stateMetrics.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "stateMetrics.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "stateMetrics.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

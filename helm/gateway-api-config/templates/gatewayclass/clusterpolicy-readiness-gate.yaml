{{- /*
Label the namespace the proxy pods run in with the AWS Load Balancer Controller pod
readiness gate label. In IP target mode, the controller then injects a readiness gate
into new proxy pods, so a pod becomes Ready only once the NLB reports its target
healthy, and a rollout cannot remove the last healthy targets before their
replacements serve. In instance target mode (the chart default) the label has no effect.

No chart owns the namespace (Flux creates it), so a Kyverno mutate-existing rule adds
the label: once when the policy is created, and again whenever the namespace is updated.
The +() anchor only adds the label when it is missing, so a value set by someone else
is left alone.
*/}}
{{- if eq .Values.provider "capa" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "labels.common" . | nindent 4 }}
    rbac.kyverno.io/aggregate-to-background-controller: "true"
  name: kyverno:gateway-api:allow-pod-readiness-gate-labeling
rules:
# Kyverno rejects a mutate-existing policy unless its background controller can get
# and update the target, so this must be in place before the ClusterPolicy below.
- apiGroups:
  - ""
  resources:
  - namespaces
  resourceNames:
  - envoy-gateway-system
  verbs:
  - get
  - update
  - patch
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: gateway-api-pod-readiness-gate-inject
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  background: true
  rules:
  - name: label-proxy-namespace
    match:
      any:
      - resources:
          kinds:
          - Namespace
          names:
          - envoy-gateway-system
    mutate:
      mutateExistingOnPolicyUpdate: true
      targets:
      - apiVersion: v1
        kind: Namespace
        name: envoy-gateway-system
      patchStrategicMerge:
        metadata:
          labels:
            +(elbv2.k8s.aws/pod-readiness-gate-inject): enabled
{{- end }}

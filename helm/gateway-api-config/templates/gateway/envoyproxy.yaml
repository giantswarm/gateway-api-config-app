{{/*
Gateway-specific EnvoyProxy defaults. Intentionally empty: base defaults (HPA, PDB, image)
live on the GatewayClass EnvoyProxy and are inherited via mergeType: StrategicMerge. This block
is kept as a placeholder for future gateway-specific defaults.
*/}}
{{- define "gatewayEnvoyProxyValuesDefault" }}
{{- end }}

{{- range $i, $gateway := .Values.gateways }}
{{- if and $gateway.enabled (dig "envoyProxy" "enabled" true $gateway) }}
{{- if not $gateway.service }}
{{- $_ := set $gateway "service" dict }}
{{- end }}
{{- $envoyProxyValues := (include "gatewayEnvoyProxyValuesDefault" $ ) | fromYaml -}}
{{- $customEnvoyProxyValues := $gateway.envoyProxy -}}
{{- if $customEnvoyProxyValues -}}
{{- $envoyProxyValues = mergeOverwrite $envoyProxyValues (deepCopy $customEnvoyProxyValues) -}}
{{- end -}}
{{- $inherited := (include "gateway.inheritedEnvoyProxy" (dict "gateway" $gateway "root" $)) | fromYaml -}}
{{- $envoyServiceDefaults := (include "gateway.envoyServiceDefaults" (dict "provider" $.Values.provider "baseDomain" $.Values.baseDomain "gateway" $gateway "root" $ "inherited" $inherited)) | fromYaml -}}
{{- $_ := set $envoyProxyValues "envoyService" (mergeOverwrite $envoyServiceDefaults (deepCopy (default dict $envoyProxyValues.envoyService))) -}}
{{- $shutdownDefaults := (include "gateway.shutdownDefaults" (dict "provider" $.Values.provider "gateway" $gateway "inherited" $inherited)) | fromYaml -}}
{{- if $shutdownDefaults -}}
{{- $_ := set $envoyProxyValues "shutdown" (mergeOverwrite $shutdownDefaults (deepCopy (default dict $envoyProxyValues.shutdown))) -}}
{{- end }}
{{- $envoyDeploymentDefaults := (include "gateway.envoyDeploymentDefaults" (dict "provider" $.Values.provider "gateway" $gateway "namespace" $.Release.Namespace "inherited" $inherited)) | fromYaml -}}
{{- if $envoyDeploymentDefaults -}}
{{- $_ := set $envoyProxyValues "envoyDeployment" (mergeOverwrite $envoyDeploymentDefaults (deepCopy (default dict $envoyProxyValues.envoyDeployment))) -}}
{{- end }}
{{- if not $envoyProxyValues.mergeType -}}
{{- $_ := set $envoyProxyValues "mergeType" "StrategicMerge" -}}
{{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: gateway-{{ $gateway.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
spec:
  {{- include "envoyProxy.spec" $envoyProxyValues | nindent 2 }}
{{- end }}
{{- end }}

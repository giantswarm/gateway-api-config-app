{{- range $i, $gateway := .Values.gateways }}
{{- if $gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gateway.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
    {{- with $gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $gateway.className }}
  {{- if dig "envoyProxy" "enabled" true $gateway }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: gateway-{{ $gateway.name }}
  {{- end }}
  {{- if dig "allowedListeners" "enabled" false $gateway }}
  allowedListeners:
    namespaces:
      from: {{ dig "allowedListeners" "namespaces" "from" "All" $gateway }}
      {{- with (dig "allowedListeners" "namespaces" "selector" dict $gateway) }}
      selector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
  listeners:
    {{- range $k, $l := $gateway.listeners }}
    {{- include "gatewayapi.listener" (dict "gateway" $gateway "listener" $l "root" $) | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}

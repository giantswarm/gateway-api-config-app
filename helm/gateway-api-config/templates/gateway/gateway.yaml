{{- range $i, $gateway := .Values.gateways }}
{{- if $gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gateway.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
    {{- with $gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $gateway.className }}
  {{- if dig "envoyProxy" "enabled" true $gateway }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: gateway-{{ $gateway.name }}
  {{- end }}
  {{- $allowedEnabled := dig "allowedListeners" "enabled" false $gateway }}
  {{- $allowedFrom := dig "allowedListeners" "namespaces" "from" "All" $gateway }}
  {{- $hasListenerSets := false }}
  {{- range $_, $ls := $gateway.listenerSets }}
  {{- if $ls.enabled }}
  {{- $hasListenerSets = true }}
  {{- end }}
  {{- end }}
  {{- if $hasListenerSets }}
  {{- if eq $allowedFrom "None" }}
  {{- fail (printf "gateway %q defines listenerSets but sets allowedListeners.namespaces.from to None, so none of them could attach." $gateway.name) }}
  {{- end }}
  {{- /* Chart-managed listener sets live in the release namespace. Opening the gateway to
         every namespace is a separate, deliberate opt-in via allowedListeners.enabled. */}}
  {{- if not $allowedEnabled }}
  {{- $allowedEnabled = true }}
  {{- $allowedFrom = "Same" }}
  {{- end }}
  {{- end }}
  {{- if $allowedEnabled }}
  allowedListeners:
    namespaces:
      from: {{ $allowedFrom }}
      {{- with (dig "allowedListeners" "namespaces" "selector" dict $gateway) }}
      selector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
  listeners:
    {{- range $k, $l := $gateway.listeners }}
    {{- include "gatewayapi.listener" (dict "gateway" $gateway "listener" $l "root" $) | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}

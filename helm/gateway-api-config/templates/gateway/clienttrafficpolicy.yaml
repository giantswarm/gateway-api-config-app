{{- range $i, $gateway := .Values.gateways }}
{{- if $gateway.enabled }}
{{- $ctp := $gateway.clientTrafficPolicy | default dict }}
{{- $isNLB := and (eq $.Values.provider "capa") (dig "provider" "aws" "useNetworkLoadBalancer" true $gateway) }}
{{- $shouldRender := ternary $ctp.enabled $isNLB (hasKey $ctp "enabled") }}
{{- if $shouldRender }}

{{- /* Build provider-specific defaults */}}
{{- $defaults := dict }}
{{- if $isNLB }}
{{- $_ := set $defaults "proxyProtocol" (dict "optional" false) }}
{{- $_ := set $defaults "healthCheck" (dict "path" "/healthz") }}
{{- end }}

{{- /* Client IP detection: a client-supplied X-Forwarded-For is never trusted.
       With a trusted proxy in front (e.g. Cloudflare), trust XFF only for connections
       coming from its CIDRs and take the first non-trusted address from the right.
       Otherwise envoy is the real edge: drop the untrusted client headers at the listener
       so envoy rebuilds X-Forwarded-For from the connection source address, which the
       PROXY protocol has already set to the real client IP. */}}
{{- $trustedProxies := $ctp.trustedProxies | default list }}
{{- $untrustedClientHeaders := $ctp.untrustedClientHeaders | default list }}
{{- if $trustedProxies }}
{{- $_ := set $defaults "clientIPDetection" (dict "xForwardedFor" (dict "trustedCIDRs" $trustedProxies)) }}
{{- else if and $isNLB $untrustedClientHeaders }}
{{- $_ := set $defaults "headers" (dict "earlyRequestHeaders" (dict "remove" $untrustedClientHeaders)) }}
{{- end }}

{{- /* Merge user values on top of defaults (user values win) */}}
{{- $spec := mergeOverwrite $defaults (deepCopy (omit $ctp "enabled" "trustedProxies" "untrustedClientHeaders")) }}

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: gateway-{{ $gateway.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gateway.name }}
  {{- with $spec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}

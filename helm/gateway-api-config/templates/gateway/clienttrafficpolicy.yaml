{{- range $i, $gateway := .Values.gateways }}
{{- if $gateway.enabled }}
{{- $ctp := $gateway.clientTrafficPolicy | default dict }}
{{- $isNLB := include "gateway.isNLB" (dict "gateway" $gateway "root" $) }}
{{- $shouldRender := ternary $ctp.enabled (ne $isNLB "") (hasKey $ctp "enabled") }}
{{- if $shouldRender }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: gateway-{{ $gateway.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gateway.name }}
  {{- with (include "clientTrafficPolicy.spec" (dict "clientTrafficPolicy" $ctp "isNLB" $isNLB)) }}
  {{- . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}

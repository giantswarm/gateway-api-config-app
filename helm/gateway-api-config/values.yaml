baseDomain: example.com

kyvernoPolicies:
  observability:
    resourceName: "{{ request.object.metadata.name }}"
    resourceNamespace: "{{ request.object.metadata.namespace }}"
  preconditions:
    key: "{{ request.object.spec.gatewayClassName }}"

gatewayClasses:  # @schema mergeProperties: true
  default:
    enabled: true
    name: giantswarm-default
    # Per-gatewayclass error pages configuration applied to all gateways in this class.
    # Per-gateway errorPages settings override these defaults.
    errorPages:  # @schema $ref: schemas/errorPages.json; skipProperties: true
      enabled: false
      statusCodes:
        - type: Range
          range:
            start: 400
            end: 404
        - type: Value
          value: 500
        - type: Value
          value: 502
        - type: Value
          value: 503
        - type: Value
          value: 504
      contentType: "text/html"
      body: ""
      existingConfigMapName: ""
    envoyProxy:  # @schema $ref: schemas/envoyProxy.json; skipProperties: true
      enabled: true
      # Controls how this GatewayClass-level EnvoyProxy merges with EnvoyGateway defaults
      # (hierarchy: EnvoyGateway defaults < GatewayClass < Gateway). Leave unset to fully
      # replace EnvoyGateway defaults; set to StrategicMerge or JSONMerge to extend them.
      # Settings here take precedence over the provider defaults the chart computes for each
      # gateway of this class (e.g. AWS NLB annotations, externalTrafficPolicy, shutdown), as
      # long as the gateway EnvoyProxy merges onto this one. Gateway values still win.
      # Shutdown fields override the chart's timers field by field, and any of them
      # drops the chart's fixed termination grace period (see the README).
      mergeType: ""
      envoyDeployment: {}
      envoyService: {}
      envoyHpa: {}
      envoyPDB: {}
      envoyServiceAccount: {}

gateways:  # @schema mergeProperties: true
  default:
    enabled: true
    name: giantswarm-default
    dnsName: gateway
    className: giantswarm-default
    overrideBaseDomain: ""
    labels: {}  # @schema additionalProperties: true
    annotations: {}  # @schema additionalProperties: true
    provider:
      aws:
        useNetworkLoadBalancer: true
        # Prefer an even spread of the proxy pods across availability zones (maxSkew 1,
        # whenUnsatisfiable: ScheduleAnyway). Only applies with useNetworkLoadBalancer.
        # Set false to remove the default constraint. A GatewayClass EnvoyProxy that sets
        # envoyDeployment.pod.topologySpreadConstraints, or a non-empty list in this
        # gateway's envoyProxy.envoyDeployment.pod.topologySpreadConstraints, replaces it.
        zoneSpread: true
        # Extra AWS tags for the NLB, its listeners and its target groups, as key: value.
        # Appended to the owning-gateway tags the chart sets. Only applies with
        # useNetworkLoadBalancer. A service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags
        # annotation set on the gateway or its GatewayClass replaces all of these tags.
        additionalResourceTags: {}  # @schema additionalProperties: {type: string}
    service:
      annotations: {}  # @schema additionalProperties: true
      labels: {}  # @schema additionalProperties: true
      externalTrafficPolicy: ""
      loadBalancerClass: ""
    tlsIssuer:
      enabled: true
      name: letsencrypt-giantswarm-gateway
      email: accounts@giantswarm.io
      gateway: giantswarm-default
    # Controls whether externally managed ListenerSets, for example ones created by a
    # tenant in their own namespace, may attach to this gateway. Chart-managed listener
    # sets (see listenerSets below) do not need this: they enable attachment from the
    # release namespace on their own.
    allowedListeners:
      enabled: false
      namespaces:
        from: All
        selector: {}  # @schema additionalProperties: true
    # Chart-managed ListenerSets, rendered in the release namespace alongside the gateway.
    # Each entry adds listeners to this gateway beyond the 64 the Gateway itself can hold,
    # with its own Certificate, DNS records and traffic policies. Listeners use the same
    # schema as gateways.<k>.listeners.
    # The ListenerSet is named <gateway.name>-<key> unless name is set; supporting
    # resources are always named gateway-<gateway.name>-<key>-<listener>.
    # Each entry accepts errorPages and backendTrafficPolicy of its own, which override
    # the gateway-wide ones for its listeners; without them the gateway policy applies.
    # Each ListenerSet carries the giantswarm.io/external-dns: managed annotation, which
    # external-dns v0.23.0 and newer needs to create records for routes attached to it. annotations of the
    # entry are added to it and can override the value.
    # Example:
    #   listenerSets:
    #     extra:
    #       enabled: true
    #       listeners:
    #         https:
    #           name: https
    #           protocol: HTTPS
    #           port: 443
    #           hostname: 'extra.{{ $.Values.baseDomain }}'
    #           certificate:
    #             enabled: true
    #             issuer:
    #               kind: ClusterIssuer
    #               name: letsencrypt-giantswarm
    #           tls:
    #             mode: Terminate
    listenerSets: {}  # @schema additionalProperties: {$ref: schemas/listenerSet.json}
    listeners:  # @schema skipProperties: true; additionalProperties: {$ref: schemas/listener.json}
      http:
        name: http
        protocol: HTTP
        port: 80
        httpsRedirectEnabled: false
        allowedRoutes:
          namespaces:
            from: All
      https:
        name: https
        protocol: HTTPS
        hostname: '*.{{ $.Values.baseDomain }}'
        subdomains: []
        certificate:
          enabled: true
          wildcard: false
          issuer:
            kind: ""
            name: ""
        dnsEndpoints:
          enabled: true
          annotations:
            giantswarm.io/external-dns: managed
        port: 443
        allowedRoutes:
          namespaces:
            from: All
        tls:
          mode: Terminate
          certificateRefs: []
    # ClientTrafficPolicy configures Envoy Gateway client traffic settings.
    # When omitted, the policy is created automatically for CAPA gateways using
    # an AWS NLB (with PROXY protocol and /healthz health check defaults).
    # Set enabled: true to create the policy regardless of provider, or
    # enabled: false to suppress creation even on CAPA+NLB.
    # All other keys are passed directly to the ClientTrafficPolicy spec and
    # override provider defaults. Available fields (see kubectl explain clienttrafficpolicy.spec):
    #
    # untrustedClientHeaders is not part of the spec. It lists the client identity
    # headers dropped at the listener before envoy reads them, so X-Forwarded-For is
    # rebuilt from the connection source address that the PROXY protocol has set to the
    # real client IP. Only applied to CAPA gateways using an AWS NLB, where envoy
    # terminates the client connection itself.
    # Empty by default, because dropping these headers changes what every backend behind
    # the gateway sees. Set it on installations where envoy is the only edge: a client can
    # otherwise dictate the first X-Forwarded-For entry and, through it, whatever a backend
    # derives from the header.
    # Leave it empty for a gateway fronted by a CDN, which legitimately supplies these
    # headers, and configure clientIPDetection for it explicitly instead.
    clientTrafficPolicy:  # @schema additionalProperties: true
      untrustedClientHeaders: []  # @schema item: string
        # - x-forwarded-for
        # - x-real-ip
    # Per-gateway error pages override gatewayClass errorPages settings.
    # Omit fields to inherit from gatewayClass config.
    errorPages: {}  # @schema $ref: schemas/errorPages.json
    # BackendTrafficPolicy configures Envoy Gateway backend traffic settings for
    # this gateway. When omitted, a policy is created only if error pages are
    # enabled (see errorPages). Any keys set here are passed directly to the
    # BackendTrafficPolicy spec and are merged into the same policy as the error
    # pages responseOverride (Envoy Gateway allows only one policy per Gateway).
    # Set enabled: false to suppress the policy even when error pages are enabled.
    # The policy also covers listeners contributed by ListenerSets attached to this
    # gateway, so a gateway-wide policy does not have to be repeated per listener set.
    # A listener set that sets its own backendTrafficPolicy or errorPages overrides it
    # for its own listeners.
    # Available fields (see kubectl explain backendtrafficpolicy.spec): circuitBreaker,
    # rateLimit, retry, loadBalancer, healthCheck, timeout, ...
    # Example:
    #   backendTrafficPolicy:
    #     circuitBreaker:
    #       maxConnections: 1024
    #       maxPendingRequests: 1024
    #       maxParallelRequests: 1024
    backendTrafficPolicy: {}  # @schema additionalProperties: true
    envoyProxy:  # @schema $ref: schemas/envoyProxy.json; skipProperties: true
      enabled: true
      # Controls how this gateway-level EnvoyProxy merges onto the GatewayClass-level one
      # (hierarchy: EnvoyGateway defaults < GatewayClass < Gateway). StrategicMerge lets the
      # gateway inherit GatewayClass base defaults (HPA, PDB, image) and only override deltas.
      # A gateway referencing a className not managed by this chart will not inherit those
      # base defaults. Defaults to StrategicMerge when left empty.
      mergeType: StrategicMerge
      envoyDeployment: {}
      envoyService: {}
      envoyHpa: {}
      envoyPDB: {}
      envoyServiceAccount: {}

# HTTPRoute backends, which the kube-state-metrics in observability-bundle does not export.
# KSM cannot iterate a list inside a list, so spec.rules[*].backendRefs[*] is read by fixed
# index: one series per rule, with the first three backends of that rule as labels. Labels of
# a backend that does not exist are left out. The rule name and the first path match keep most
# rules with the same backends apart. Rules that only differ in later matches, methods or
# headers still produce the same series, which the scrape keeps once.
# resourcePlural is also used for the RBAC rules of the instance.
- groupVersionKind:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    version: v1
  resourcePlural: httproutes
  metricNamePrefix: gatewayapi_httproute
  labelsFromPath:
    name: [metadata, name]
    namespace: [metadata, namespace]
  metrics:
    - name: rule_backend_info
      help: "First three backendRefs of each HTTPRoute rule"
      each:
        type: Info
        info:
          path: [spec, rules]
          labelsFromPath:
            rule_name: [name]
            match_path_type: [matches, "0", path, type]
            match_path: [matches, "0", path, value]
            backend0_kind: [backendRefs, "0", kind]
            backend0_namespace: [backendRefs, "0", namespace]
            backend0_name: [backendRefs, "0", name]
            backend0_port: [backendRefs, "0", port]
            backend0_weight: [backendRefs, "0", weight]
            backend1_kind: [backendRefs, "1", kind]
            backend1_namespace: [backendRefs, "1", namespace]
            backend1_name: [backendRefs, "1", name]
            backend1_port: [backendRefs, "1", port]
            backend1_weight: [backendRefs, "1", weight]
            backend2_kind: [backendRefs, "2", kind]
            backend2_namespace: [backendRefs, "2", namespace]
            backend2_name: [backendRefs, "2", name]
            backend2_port: [backendRefs, "2", port]
            backend2_weight: [backendRefs, "2", weight]

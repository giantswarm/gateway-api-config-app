# Values provided here merge on top of the default CAPA values found in
# https://github.com/giantswarm/cluster-standup-teardown
global:
  connectivity:
    certManager:
      useDnsChallenges: true

  # One ASG node pool plus one Karpenter node pool, mirroring
  # giantswarm/cluster-test-suites providers/capa/standard and how customers run
  # in production. Capping nodepool-0 at a single node leaves Karpenter to supply
  # the rest of the capacity, so the envoy proxies and their NLB targets end up
  # on Karpenter-provisioned nodes.
  nodePools:
    nodepool-0:
      minSize: 1
      maxSize: 1
    # The name has 10 characters, the maximum our Kyverno policies allow.
    np-karpntr:
      type: karpenter
      rootVolumeSizeGB: 15
      libVolumeSizeGB: 30
      logVolumeSizeGB: 10
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: NotIn
          values:
            - t3
            - t3a
            - t2
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values:
            - "4"
            - "8"
            - "16"
            - "32"
        - key: karpenter.k8s.aws/instance-hypervisor
          operator: In
          values:
            - nitro
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
            - on-demand
        - key: kubernetes.io/os
          operator: In
          values:
            - linux

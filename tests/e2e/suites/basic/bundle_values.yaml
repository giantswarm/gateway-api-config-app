apps:
  gatewayApiCrds:
    # Envoy Gateway 1.9 requires Gateway API v1.6 CRDs.
    version: 1.9.1
  envoyGateway:
    # shutdown.healthCheckFailureDelay requires Envoy Gateway 1.9.
    version: 1.10.0
  gatewayApiConfig:
    userConfig:
      configMap:
        values:
          gatewayClasses:
            default:
              errorPages:
                enabled: true
                statusCodes:
                  - type: Value
                    value: 500
                  - type: Value
                    value: 502
                  - type: Range
                    range:
                      start: 503
                      end: 504
                contentType: "text/html"
                body: "<html><body><h1>Service Unavailable</h1></body></html>"
          gateways:
            default:
              dnsName: ingress
              allowedListeners:
                enabled: true
                namespaces:
                  from: All
              listenerSets:
                extra:
                  enabled: true
                  errorPages:
                    body: "<html><body><h1>ListenerSet Error Page</h1></body></html>"
                  listeners:
                    https:
                      name: https
                      protocol: HTTPS
                      port: 443
                      # Escaped on purpose: the bundle chart runs tpl over these
                      # user values with its own context, where baseDomain is the
                      # installation base domain rather than the cluster's. The
                      # escape leaves the template for gateway-api-config to render
                      # from its own cluster-values.
                      hostname: 'lset-chart.{{ "{{ $.Values.baseDomain }}" }}'
                      allowedRoutes:
                        namespaces:
                          from: All
                      certificate:
                        enabled: true
                        issuer:
                          kind: ClusterIssuer
                          name: letsencrypt-giantswarm
                      dnsEndpoints:
                        # DNS comes from the HTTPRoute via the external-dns
                        # gateway-httproute source, not from a DNSEndpoint.
                        enabled: false
                      tls:
                        mode: Terminate
              errorPages:
                body: "<html><body><h1>Giant Swarm - Service Unavailable</h1></body></html>"
              backendTrafficPolicy:
                circuitBreaker:
                  maxConnections: 1024
                  maxPendingRequests: 1024
                  maxParallelRequests: 1024
              listeners:
                http:
                  httpsRedirectEnabled: true
                  allowedRoutes:
                    namespaces:
                      from: Same
                https:
                  dnsEndpoints:
                    enabled: false
                  certificate:
                    enabled: true
                    wildcard: true
                    issuer:
                      kind: ClusterIssuer
                      name: letsencrypt-giantswarm
